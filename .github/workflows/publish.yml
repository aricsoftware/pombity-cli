name: publish

# Publishing to npm runs ONLY on a v* tag, and even then only when the repository
# variable NPM_PUBLISH_ENABLED is 'true'. Both locks are test-locked in
# tests/workflows.test.js. Publishing uses npm trusted publishing (OIDC): the
# npmjs.com package is configured to trust this repository + workflow, so there
# is no token anywhere; provenance is generated because the repository is public.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ">=22.14"
      - run: npm install -g npm@^11.5.1
      - run: npm run lint
      - run: npm test
      - run: npm publish --access public --provenance
